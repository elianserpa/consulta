<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dr. Elian Serpa · Contacto</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--bg:#f4f8fc;--ink:#2b3a4a;--mute:#5f6f80;--line:#dde6ef;--card:rgba(255,255,255,.72);--accent:#5f8fbf;--accent2:#b9cde3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141b24;--ink:#e6eef7;--mute:#a9b7c6;--line:#263444;--card:rgba(28,38,50,.7);--accent:#7aa6cf;--accent2:#4d6a86}}
:root[data-theme="dark"]{--bg:#141b24;--ink:#e6eef7;--mute:#a9b7c6;--line:#263444;--card:rgba(28,38,50,.7);--accent:#7aa6cf;--accent2:#4d6a86}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6;overflow-x:hidden}
#bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;display:block}
body.nogl::before{content:'';position:fixed;right:9%;top:20%;width:40vmin;height:40vmin;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e3eef9,#8fb4dc);opacity:.8;z-index:0;animation:fl 8s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-26px) scale(1.04)}}
main{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:0 24px}
nav{display:flex;justify-content:space-between;align-items:center;padding:28px 0;font-size:14px;color:var(--mute)}
nav b{color:var(--ink);font-weight:600;letter-spacing:.02em}
nav a{color:var(--mute);text-decoration:none;transition:color .3s}nav a:hover{color:var(--ink)}
.hero h1,.hero .lead,.hero .tag{text-shadow:0 0 18px var(--bg),0 0 6px var(--bg)}
.hero{min-height:78vh;display:flex;flex-direction:column;justify-content:center;max-width:540px}
.tag{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent)}
h1{font-size:clamp(38px,6vw,64px);font-weight:300;line-height:1.08;margin:14px 0 18px;letter-spacing:-.02em}
h1 span{font-weight:600}
.lead{color:var(--mute);font-size:17px;max-width:430px}
.btn{display:inline-block;margin-top:30px;padding:13px 28px;border-radius:999px;background:var(--accent);color:#fff;text-decoration:none;font-size:15px;border:0;cursor:pointer;transition:transform .3s,box-shadow .3s;box-shadow:0 10px 30px -12px var(--accent)}
.btn:hover{transform:translateY(-2px);box-shadow:0 16px 34px -12px var(--accent)}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--accent);box-shadow:none;margin:0}
.btn.alt:hover{background:var(--accent);color:#fff}
.actions{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:28px}
.actions .btn{margin-top:0}
.lg button{background:none;border:0;color:var(--mute);font:inherit;cursor:pointer;padding:0 4px}.lg button.on{color:var(--ink);font-weight:600}
.lockup{display:flex;align-items:center;gap:clamp(12px,2vw,20px);margin-bottom:12px}
.lockup img{height:clamp(62px,8.5vw,96px);width:auto;display:block}
.lockup .hero-name{margin:0}
.lockup .ic-d,.flogo .lg-d{display:none}
.flogo{margin-bottom:14px}.flogo img{width:min(320px,70vw);height:auto;margin:0 auto}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ic-l,:root:not([data-theme="light"]) .lg-l{display:none}:root:not([data-theme="light"]) .ic-d,:root:not([data-theme="light"]) .lg-d{display:block}}
:root[data-theme="dark"] .ic-l,:root[data-theme="dark"] .lg-l{display:none}:root[data-theme="dark"] .ic-d,:root[data-theme="dark"] .lg-d{display:block}
.fl svg{vertical-align:-2px;border-radius:2px;margin-right:2px}
.hero-name{font-size:clamp(34px,5.5vw,56px);font-weight:600;letter-spacing:-.02em;line-height:1.1;margin-bottom:12px}
.hero .hero-name{text-shadow:0 0 18px var(--bg),0 0 6px var(--bg)}
.prof{display:flex;gap:30px;align-items:flex-start;margin-bottom:22px}
.prof img{width:190px;flex:none;border-radius:20px;box-shadow:0 14px 34px -16px rgba(60,90,130,.45)}
.nr{display:flex;gap:20px;align-items:center}
.bio{font-size:15px;line-height:1.75;margin-bottom:16px}
.sec{padding:10px 0 26px}
.dr{font-size:20px;font-weight:600;margin-bottom:8px}
[hidden]{display:none!important}
.two{display:grid;grid-template-columns:1fr 1fr;gap:30px}
.price{font-size:44px;font-weight:300;margin:6px 0}
.rows{display:grid;grid-template-columns:1fr 1fr;column-gap:30px}
.cal{max-width:340px;width:100%;margin:0 auto}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;text-transform:capitalize}
.ch button{background:none;border:0;color:var(--ink);font-size:20px;cursor:pointer;padding:4px 12px}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cg span{font-size:11px;color:var(--mute)}
.cg button{aspect-ratio:1;border:0;border-radius:50%;background:transparent;color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.cg button:disabled{color:var(--mute);opacity:.35;cursor:default}
.cg button.on,.chips button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 18px}
.chips button{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:7px 14px;font:inherit;font-size:13px;cursor:pointer}
#hs{margin:14px 0 0}
.err{color:#c0626b;font-size:13px;text-align:center;min-height:18px;margin-top:14px}
.note{font-size:12px;color:var(--mute);margin-top:18px}
.tele{padding:10px 0 30px}.tele p{color:var(--mute);max-width:620px}
.grid{display:grid;grid-template-columns:1fr 1.2fr;gap:24px;padding:40px 0 70px}
.card{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:22px;padding:30px}
.card h2{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);font-weight:500;margin-bottom:20px}
.row{padding:14px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.row small{display:block;color:var(--mute);font-size:12px}
.row a,.row span{color:var(--ink);text-decoration:none;font-size:16px}
label{display:block;font-size:12px;color:var(--mute);margin:14px 0 6px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--line);padding:8px 0;outline:0;transition:border-color .3s}
input:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:84px}
footer{text-align:center;color:var(--mute);font-size:12px;padding:0 0 36px}
@media(max-width:760px){.two,.rows{grid-template-columns:1fr}.prof{flex-direction:column;align-items:center}.prof img{width:170px}#bg{opacity:.45}.grid{grid-template-columns:1fr}.hero{min-height:70vh}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>

var T={
es:{c:'Contacto',tag:'Medicina general · Telemedicina',h1:'Donde la <span>medicina</span><br>también sabe escuchar.',

ih:'Información de la consulta',i2t:'Telemedicina',i2p:'Consulta por videollamada en Zoom, desde cualquier lugar del mundo.',
ch:'Mis datos de contacto',
b1:'Médico con experiencia en atención primaria, medicina de emergencias y salud rural, brindando atención integral a pacientes de todas las edades y contextos socioeconómicos. Enfocado en un abordaje clínico basado en la evidencia, con un fuerte énfasis en el diagnóstico temprano, manejo de enfermedades prevalentes y optimización de tratamientos según los recursos disponibles.',
b2:'Comprometido con la prevención de enfermedades y la promoción de la salud, desarrollo estrategias para la educación sanitaria, detección precoz de enfermedades y reducción de brechas en el acceso a la atención médica. Experiencia en el manejo de enfermedades crónicas, vacunación, salud maternoinfantil y campañas de salud comunitaria, fundamentales en todos los sistemas de salud.',
rl1:'Correo',rl2:'Teléfono / WhatsApp',rl4:'Horario',rv4:'Todos los días · 09:00 – 22:00 (hora de Ecuador, GMT-5)',rl5:'Modalidad',rv5:'Telemedicina por Zoom',
ah:'Agenda tu cita',ap:'Elige en mi calendario el día y la hora que mejor te convengan. Recibirás una confirmación por correo, desde donde podrás cambiar o cancelar tu cita.',ab:'Reservar mi cita',
an:'Por favor, no compartas datos clínicos sensibles al reservar; los trataremos en la consulta.'},
en:{c:'Contact',tag:'General medicine · Telemedicine',h1:'Where medicine<br><span>also listens</span>.',
lead:'Telemedicine consultations for patients anywhere in the world. Book your appointment online.',cta:'Book your appointment',
ih:'Consultation information',i2t:'Telemedicine',i2p:'Video consultation via Zoom, from anywhere in the world.',
ch:'My contact details',
b1:'Medical Doctor with experience in primary care, emergency medicine, and rural healthcare, providing comprehensive care to patients of all ages and socioeconomic backgrounds. Focused on an evidence-based clinical approach, with a strong emphasis on early diagnosis, management of prevalent diseases, and treatment optimization based on available resources.',
b2:'Committed to disease prevention and health promotion, I develop strategies for health education, early disease detection, and reducing gaps in healthcare access. Experienced in chronic disease management, vaccination, maternal and child healthcare, and community health campaigns, which are essential in all healthcare systems.',
rl1:'Email',rl2:'Phone / WhatsApp',rl4:'Hours',rv4:'Every day · 09:00 – 22:00 (Ecuador time, GMT-5)',rl5:'Format',rv5:'Telemedicine via Zoom',

function lang(l){document.documentElement.lang=l;
  document.querySelectorAll('[data-i]').forEach(function(e){e.innerHTML=T[l][e.getAttribute('data-i')]});
  $('es').className=l==='es'?'on':'';$('en').className=l==='en'?'on':''}
$('es').onclick=function(){lang('es')};$('en').onclick=function(){lang('en')};
lang('es');
try{
  var cv=document.getElementById('bg');
  var R=new THREE.WebGLRenderer({canvas:cv,alpha:true,antialias:true});
  R.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));
  var S=new THREE.Scene(),C=new THREE.PerspectiveCamera(45,1,.1,50);C.position.z=6;
  S.add(new THREE.AmbientLight(0xffffff,.75));
  var L1=new THREE.DirectionalLight(0xcfe3f7,.9);L1.position.set(3,4,5);S.add(L1);
  var L2=new THREE.DirectionalLight(0xdfe6ee,.5);L2.position.set(-4,-2,3);S.add(L2);
  var g=new THREE.SphereGeometry(1.5,72,72),base=g.attributes.position.array.slice();
  var blob=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:0x8fb4dc,roughness:.4,metalness:.08}));
  var ring=new THREE.Mesh(new THREE.TorusGeometry(2.3,.025,16,160),new THREE.MeshStandardMaterial({color:0xc9d6e3}));
  var ring2=ring.clone();ring2.scale.set(1.25,1.25,1.25);
  var grp=new THREE.Group();grp.add(blob,ring,ring2);S.add(grp);
  var orbs=[];for(var i=0;i<3;i++){var o=new THREE.Mesh(new THREE.SphereGeometry(.18-.04*i,24,24),new THREE.MeshStandardMaterial({color:[0xdfe9f4,0xb7cbe0,0xe9eef3][i],roughness:.4}));S.add(o);orbs.push(o)}
  var mx=0,my=0,t=0;
  addEventListener('pointermove',function(e){mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5});
  function fit(){var w=innerWidth,h=innerHeight;R.setSize(w,h,false);C.aspect=w/h;C.updateProjectionMatrix();
    var wide=w>760,hw=2.485*C.aspect;grp.position.set(wide?Math.min(3.0,hw*.6):0,wide?0:1.9,0);grp.scale.setScalar(wide?.92:.6)}
  addEventListener('resize',fit);fit();
  var p=g.attributes.position;
  (function loop(){
    t+=.008;
    for(var i=0;i<p.count;i++){
      var x=base[i*3],y=base[i*3+1],z=base[i*3+2];
      var d=1+.13*Math.sin(x*1.7+t*2)*Math.cos(y*1.5+t*1.6)+.08*Math.sin(z*2.3+t*2.4);
      p.setXYZ(i,x*d,y*d,z*d);
    }
    p.needsUpdate=true;g.computeVertexNormals();
    blob.rotation.y=t*.6;ring.rotation.set(t*.5+1.2,t*.3,0);ring2.rotation.set(-t*.3+.4,t*.4,.6);
    grp.rotation.x+=((my*.5)-grp.rotation.x)*.04;grp.rotation.y+=((mx*.7)-grp.rotation.y)*.04;
    orbs.forEach(function(o,i){var a=t*(1.1+i*.4)+i*2.1;o.position.set(grp.position.x+Math.cos(a)*(2.6+i*.3)*grp.scale.x,grp.position.y+Math.sin(a*.8)*1.6*grp.scale.x,Math.sin(a)*1.5)});
    R.render(S,C);requestAnimationFrame(loop);
  })();
}catch(err){document.body.classList.add('nogl')}
